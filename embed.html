<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeteZah Embed Player - Official PeteZah Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #030712; color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #player-container {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; background: #000;
    }
    /* TOP AD LEADERBOARD */
    #top-ad-bar {
      width: 100%; min-height: 52px; background: #0b0f19;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      padding: 4px 8px; position: relative; z-index: 50;
    }
    .ad-frame-wrapper {
      max-width: 728px; width: 100%; display: flex;
      justify-content: center; align-items: center; overflow: hidden;
    }
    /* MAIN GAME & SIDE AD LAYOUT */
    #game-layout {
      position: relative; flex: 1; display: flex;
      width: 100%; height: 100%; overflow: hidden;
    }
    .side-ad {
      width: 130px; background: #070a14; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 4px; border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05); z-index: 20;
    }
    @media (min-width: 960px) {
      .side-ad { display: flex; }
    }
    #viewport-wrapper {
      position: relative; flex: 1; height: 100%;
      background: #000; display: flex; align-items: center; justify-content: center;
    }
    #game-iframe {
      width: 100%; height: 100%; border: none; outline: none;
      background: #000; display: block;
    }
    /* PREROLL AD OVERLAY */
    #preroll-overlay {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(14px); z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 20px; text-align: center;
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    #preroll-overlay.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .preroll-box {
      width: 100%; max-width: 620px; background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 16px;
      padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.2);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .preroll-title {
      font-size: 18px; font-weight: 800; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .preroll-timer {
      font-size: 13px; color: #fbbf24; font-weight: 600;
      background: rgba(245, 158, 11, 0.1); padding: 4px 12px;
      border-radius: 999px; border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .skip-button {
      padding: 10px 24px; border-radius: 10px; font-size: 13px;
      font-weight: 700; cursor: pointer; border: none; transition: all 0.2s ease;
    }
    .skip-button.disabled {
      background: rgba(255, 255, 255, 0.08); color: #6b7280; cursor: not-allowed;
    }
    .skip-button.enabled {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff; box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4); cursor: pointer;
    }
    /* BOTTOM CONTROLS & BRANDING BAR */
    #bottom-bar {
      width: 100%; height: 38px; background: #090d16;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; font-size: 12px; z-index: 50;
    }
    .brand-link {
      display: flex; align-items: center; gap: 6px;
      color: #fbbf24; text-decoration: none; font-weight: 700; font-size: 12px;
    }
    .ctrl-group { display: flex; align-items: center; gap: 8px; }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d5db; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      font-size: 11px; font-weight: 600; display: flex; align-items: center;
      gap: 4px; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  </style>

            </div>
            <button id="skip-btn" class="skip-button disabled" onclick="skipPreroll()">
              Please wait 5s...

        </div>

        <iframe id="game-iframe" allow="autoplay; fullscreen; gamepad; focus-without-user-activation; clipboard-read; clipboard-write" allowfullscreen></iframe>

      <div class="side-ad">

    const urlParams = new URLSearchParams(window.location.search);
    const requestedGame = (urlParams.get('game') || urlParams.get('id') || 'drive-mad').toLowerCase().trim();
    const customUrl = urlParams.get('url');

    const matched = PETEZAH_GAMES.find(g => 
      g.id.toLowerCase() === requestedGame || 
      g.id.toLowerCase().replace(/-/g, '') === requestedGame.replace(/-/g, '') ||
      g.label.toLowerCase() === requestedGame
    ) || PETEZAH_GAMES[0];

    const basePath = window.location.pathname.includes('/petezah-mirrors') ? '/petezah-mirrors' : '';
    let targetUrl = customUrl || (matched ? (matched.url.startsWith('/') ? basePath + matched.url : matched.url) : (basePath + '/games/ubg/drive-mad.html'));

    if (matched) {
      document.getElementById('preroll-game-title').textContent = '🎮 Loading ' + matched.label + ' via PeteZah API...';
      document.title = matched.label + ' - PeteZah Embed Player';
    }

    const iframe = document.getElementById('game-iframe');
    const overlay = document.getElementById('preroll-overlay');
    const countdownNum = document.getElementById('countdown-num');
    const skipBtn = document.getElementById('skip-btn');

    let timeLeft = 5;
    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        countdownNum.textContent = timeLeft;
        skipBtn.textContent = 'Please wait ' + timeLeft + 's...';
      } else {
        clearInterval(timer);
        countdownNum.textContent = '0';
        skipBtn.textContent = '▶ Play Game Now';
        skipBtn.className = 'skip-button enabled';
      }
    }, 1000);

    function skipPreroll() {
      if (timeLeft > 0) return;
      overlay.classList.add('hidden');
      if (!iframe.src) { iframe.src = targetUrl; }
    }

    function triggerAdBreak() {
      overlay.classList.remove('hidden');
      timeLeft = 3;
      skipBtn.className = 'skip-button disabled';
      skipBtn.textContent = 'Ad Break (3s)...';
      countdownNum.textContent = '3';
      const adTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          countdownNum.textContent = timeLeft;
          skipBtn.textContent = 'Ad Break (' + timeLeft + 's)...';
        } else {
          clearInterval(adTimer);
          countdownNum.textContent = '0';
          skipBtn.textContent = '▶ Resume Game';
          skipBtn.className = 'skip-button enabled';
        }
      }, 1000);
    }

    function reloadGame() { iframe.src = targetUrl; }
    function toggleFullscreen() {
      const el = document.getElementById('player-container');
      if (!document.fullscreenElement) { el.requestFullscreen().catch(() => {}); }
      else { document.exitFullscreen().catch(() => {}); }
    }
